## Managed components -- resolved by `idf.py reconfigure`.
dependencies:
  idf:
    version: ">=5.1"
  espressif/led_strip:
    # 3.x introduced the `color_component_format` field used by led_driver.c
    # and is the first major-version branch that builds cleanly under IDF 6.x
    # (the 2.5.x SPI backend miss-includes esp_heap_caps.h).
    version: "^3.0.0"
  espressif/cjson:
    version: "*"
    rules:
      # In IDF <6.0 cJSON ships as the built-in `json` core component, so the
      # managed package is not needed there.
      - if: "idf_version >=6.0"
  espressif/mqtt:
    version: "*"
    rules:
      # Same story: IDF <6.0 ships esp-mqtt as the built-in `mqtt` core
      # component; from 6.0 it is fetched from the registry.
      - if: "idf_version >=6.0"
