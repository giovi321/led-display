<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="system-ui, sans-serif">
  <defs>
    <marker id="marr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8f8e96"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#0b0b0d"/>

  <!-- arrows first -->
  <line x1="560" y1="104" x2="560" y2="128" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="560" y1="192" x2="560" y2="216" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="424" y1="280" x2="368" y2="316" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="560" y1="280" x2="560" y2="316" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="696" y1="280" x2="752" y2="316" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="368" y1="404" x2="480 " y2="444" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="560" y1="404" x2="560" y2="444" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="752" y1="404" x2="640" y2="444" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>

  <line x1="600" y1="404" x2="680" y2="432" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="756" y1="464" x2="778" y2="464" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="714" y1="508" x2="714" y2="494" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>
  <line x1="756" y1="536" x2="778" y2="536" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#marr)"/>

  <!-- boot sequence (left column) -->
  <rect x="40" y="64" width="200" height="372" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="140" y="92" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Boot sequence</text>
  <text x="56" y="118" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">1 settings (NVS)</text>
  <text x="56" y="138" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">2 layout &#8594; LUT</text>
  <text x="56" y="158" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">3 display + splash</text>
  <text x="56" y="178" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">4 wifi (STA/AP)</text>
  <text x="56" y="198" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">5 integrations</text>
  <text x="56" y="218" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">6 scheduler + SNTP</text>
  <text x="56" y="238" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">7 light sensor</text>
  <text x="56" y="258" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">8 http server</text>
  <text x="56" y="278" fill="#ffb347" font-size="11" font-family="ui-monospace, monospace">9 mark OTA valid</text>
  <text x="56" y="298" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">10 wg, mqtt, poller</text>
  <text x="56" y="318" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">11 boot webhook</text>
  <text x="56" y="352" fill="#8f8e96" font-size="10">The image is valid only once</text>
  <text x="56" y="368" fill="#8f8e96" font-size="10">HTTP is up. The dial-out</text>
  <text x="56" y="384" fill="#8f8e96" font-size="10">clients start after step 9, so</text>
  <text x="56" y="400" fill="#8f8e96" font-size="10">a fault cannot revert a good</text>
  <text x="56" y="416" fill="#8f8e96" font-size="10">update.</text>

  <!-- client -->
  <rect x="472" y="40" width="176" height="64" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="560" y="68" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Browser / API client</text>
  <text x="560" y="88" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">HTTP :80, X-Api-Key</text>

  <!-- http layer -->
  <rect x="424" y="128" width="272" height="64" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="560" y="156" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">web_server + web_common</text>
  <text x="560" y="176" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">auth, host check, gzipped assets</text>

  <!-- api handlers (accent: this is the surface everything talks to) -->
  <rect x="424" y="216" width="272" height="64" rx="6" fill="#241a0c" stroke="#ffb347"/>
  <text x="560" y="238" fill="#ffb347" font-size="13" font-weight="600" text-anchor="middle">api_* handler modules</text>
  <text x="560" y="256" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">display &#183; layout &#183; colors &#183; wifi</text>
  <text x="560" y="270" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">system &#183; config &#183; ota &#183; integrations</text>

  <!-- service row -->
  <rect x="256" y="316" width="224" height="88" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="368" y="344" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Display stack</text>
  <text x="368" y="364" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">display &#183; led_driver &#183; mapping LUT</text>
  <text x="368" y="380" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">RMT &#8594; WS2812B chain</text>

  <rect x="504" y="316" width="112" height="88" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="560" y="342" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Integrations</text>
  <text x="560" y="362" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">webhooks</text>
  <text x="560" y="378" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">valuefmt</text>
  <text x="560" y="394" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">mqtt_link</text>

  <rect x="640" y="316" width="224" height="88" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="752" y="342" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">System services</text>
  <text x="752" y="362" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">ota_update &#183; wg_client</text>
  <text x="752" y="378" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">scheduler &#183; wifi_manager</text>
  <text x="752" y="394" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">light_sensor &#8594; brightness arbiter</text>

  <!-- NVS -->
  <rect x="480" y="444" width="160" height="48" rx="6" fill="#101013" stroke="#2b2b33"/>
  <text x="560" y="464" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">NVS</text>
  <text x="560" y="482" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">settings + JSON blobs</text>

  <!-- value path: every value source ends in value_feed -->
  <rect x="672" y="436" width="84" height="56" rx="6" fill="#241a0c" stroke="#ffb347"/>
  <text x="714" y="458" fill="#ffb347" font-size="13" font-weight="600" text-anchor="middle">value_feed</text>
  <text x="714" y="476" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">ingest hub</text>

  <rect x="780" y="436" width="84" height="56" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="822" y="458" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">fallback</text>
  <text x="822" y="476" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">state machine</text>

  <rect x="672" y="508" width="84" height="56" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="714" y="530" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">value_poll</text>
  <text x="714" y="548" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">URL poller</text>

  <rect x="780" y="508" width="84" height="56" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="822" y="530" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">jsonpath</text>
  <text x="822" y="548" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">path scanner</text>

  <text x="768" y="586" fill="#8f8e96" font-size="10" text-anchor="middle">http, mqtt and poll all enter value_feed</text>
</svg>
