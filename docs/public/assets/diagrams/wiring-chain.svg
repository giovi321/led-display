<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui, sans-serif">
  <defs>
    <pattern id="leds" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.6" fill="#2b2b33"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffb347"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#0b0b0d"/>

  <!-- chain polyline: controller -> 0 (bottom-left) -> 1 (bottom-right) -> 2 (top-right) -> 3 (top-left) -->
  <polyline points="220,304 428,304" fill="none" stroke="#ffb347" stroke-width="2" marker-end="url(#arr)"/>
  <polyline points="452,304 704,304" fill="none" stroke="#ffb347" stroke-width="2" marker-end="url(#arr)"/>
  <polyline points="716,292 716,176" fill="none" stroke="#ffb347" stroke-width="2" marker-end="url(#arr)"/>
  <polyline points="704,164 452,164" fill="none" stroke="#ffb347" stroke-width="2" marker-end="url(#arr)"/>

  <!-- controller -->
  <rect x="40" y="252" width="180" height="104" rx="6" fill="#17171b" stroke="#2b2b33"/>
  <text x="130" y="292" fill="#ecebe6" font-size="14" font-weight="600" text-anchor="middle">Controller</text>
  <text x="130" y="314" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">ESP32-S3 + 74HCT125</text>
  <text x="130" y="330" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">GPIO16 &#8594; DIN</text>

  <!-- top row: mounted rotated 180 (first-LED corner bottom-right) -->
  <g>
    <rect x="300" y="104" width="256" height="120" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <rect x="304" y="108" width="248" height="112" fill="url(#leds)"/>
    <circle cx="428" cy="164" r="16" fill="#0b0b0d" stroke="#2b2b33"/>
    <text x="428" y="169" fill="#ecebe6" font-size="14" font-weight="600" text-anchor="middle">3</text>
    <circle cx="544" cy="212" r="4" fill="#ffb347"/>
    <text x="316" y="126" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace">rot 180&#176;</text>
  </g>
  <g>
    <rect x="588" y="104" width="256" height="120" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <rect x="592" y="108" width="248" height="112" fill="url(#leds)"/>
    <circle cx="716" cy="164" r="16" fill="#0b0b0d" stroke="#2b2b33"/>
    <text x="716" y="169" fill="#ecebe6" font-size="14" font-weight="600" text-anchor="middle">2</text>
    <circle cx="832" cy="212" r="4" fill="#ffb347"/>
    <text x="604" y="126" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace">rot 180&#176;</text>
  </g>

  <!-- bottom row: mounted upright (first-LED corner top-left) -->
  <g>
    <rect x="300" y="244" width="256" height="120" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <rect x="304" y="248" width="248" height="112" fill="url(#leds)"/>
    <circle cx="428" cy="304" r="16" fill="#0b0b0d" stroke="#2b2b33"/>
    <text x="428" y="309" fill="#ecebe6" font-size="14" font-weight="600" text-anchor="middle">0</text>
    <circle cx="312" cy="256" r="4" fill="#ffb347"/>
  </g>
  <g>
    <rect x="588" y="244" width="256" height="120" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <rect x="592" y="248" width="248" height="112" fill="url(#leds)"/>
    <circle cx="716" cy="304" r="16" fill="#0b0b0d" stroke="#2b2b33"/>
    <text x="716" y="309" fill="#ecebe6" font-size="14" font-weight="600" text-anchor="middle">1</text>
    <circle cx="600" cy="256" r="4" fill="#ffb347"/>
  </g>

  <!-- labels on the chain -->
  <rect x="296" y="386" width="308" height="16" fill="#0b0b0d"/>
  <text x="320" y="398" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">numbers = position in the data chain</text>
  <rect x="640" y="386" width="204" height="16" fill="#0b0b0d"/>
  <text x="664" y="398" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">&#9679; = first LED (DIN corner)</text>

  <!-- caption -->
  <line x1="40" y1="424" x2="860" y2="424" stroke="#2b2b33"/>
  <text x="40" y="448" fill="#8f8e96" font-size="12">Physical chain order and mounting rarely match the logical picture: here the chain enters at the</text>
  <text x="40" y="466" fill="#8f8e96" font-size="12">bottom row and the top row is glued in upside down. The arrangement editor describes exactly this.</text>
</svg>
