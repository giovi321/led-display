<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="parr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8f8e96"/>
    </marker>
  </defs>

  <rect width="900" height="320" fill="#0b0b0d"/>

  <!-- arrows between stages -->
  <line x1="164" y1="120" x2="184" y2="120" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#parr)"/>
  <line x1="312" y1="120" x2="332" y2="120" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#parr)"/>
  <line x1="460" y1="120" x2="480" y2="120" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#parr)"/>
  <line x1="608" y1="120" x2="628" y2="120" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#parr)"/>
  <line x1="756" y1="120" x2="776" y2="120" stroke="#8f8e96" stroke-width="1.5" marker-end="url(#parr)"/>

  <!-- stages -->
  <g>
    <rect x="40" y="88" width="124" height="64" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <text x="102" y="116" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Logical pixel</text>
    <text x="102" y="136" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">(x, y)</text>
  </g>
  <g>
    <rect x="188" y="88" width="124" height="64" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <text x="250" y="116" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Cell lookup</text>
    <text x="250" y="136" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">row, col &#8594; chain, rot</text>
  </g>
  <g>
    <rect x="336" y="88" width="124" height="64" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <text x="398" y="116" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Undo rotation</text>
    <text x="398" y="136" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">cell &#8594; panel frame</text>
  </g>
  <g>
    <rect x="484" y="88" width="124" height="64" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <text x="546" y="116" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Wiring walk</text>
    <text x="546" y="136" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">origin + axis + serp</text>
  </g>
  <g>
    <rect x="632" y="88" width="124" height="64" rx="6" fill="#17171b" stroke="#2b2b33"/>
    <text x="694" y="116" fill="#ecebe6" font-size="13" font-weight="600" text-anchor="middle">Chain offset</text>
    <text x="694" y="136" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">chain &#183; w &#183; h + off</text>
  </g>
  <g>
    <rect x="780" y="88" width="88" height="64" rx="6" fill="#241a0c" stroke="#ffb347"/>
    <text x="824" y="116" fill="#ffb347" font-size="13" font-weight="600" text-anchor="middle">LUT</text>
    <text x="824" y="136" fill="#8f8e96" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">strip index</text>
  </g>

  <!-- worked example: 2x2 grid of 32x8 col-serpentine TL panels, bottom row rot 180 -->
  <line x1="40" y1="192" x2="868" y2="192" stroke="#2b2b33"/>
  <text x="40" y="216" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace">worked example: 2x2 grid of 32x8 panels, col-serpentine, first LED top-left, bottom row mounted rot 180</text>

  <text x="102" y="248" fill="#ecebe6" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">(37, 12)</text>
  <text x="250" y="248" fill="#ecebe6" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">cell(1,1)</text>
  <text x="250" y="266" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">chain 2, rot 180</text>
  <text x="398" y="248" fill="#ecebe6" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">local (5,4)</text>
  <text x="398" y="266" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">&#8594; panel (26,3)</text>
  <text x="546" y="248" fill="#ecebe6" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">offset 211</text>
  <text x="546" y="266" fill="#8f8e96" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">26&#183;8 + 3</text>
  <text x="694" y="248" fill="#ecebe6" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">2&#183;256 + 211</text>
  <text x="824" y="248" fill="#ffb347" font-size="12" font-weight="600" font-family="ui-monospace, monospace" text-anchor="middle">723</text>

  <text x="40" y="300" fill="#8f8e96" font-size="11">The table is rebuilt once per layout change; per frame each pixel is a single array read.</text>
</svg>
